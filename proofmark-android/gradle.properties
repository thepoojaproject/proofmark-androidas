# Project-wide Gradle settings.

# JVM heap and encoding used by the Gradle daemon.
org.gradle.jvmargs=-Xmx2560m -Dfile.encoding=UTF-8

# Run independent modules in parallel and reuse the configuration cache
# across builds — meaningfully speeds up both local and CI builds.
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# AndroidX is required; the old Support Library is not used anywhere in
# this project.
android.useAndroidX=true

# Kotlin code style used by the IDE/formatter.
kotlin.code.style=official

# Disables the build feature flags (BuildConfig, resValues, etc.) this
# project doesn't use, trimming a little build time and APK metadata.
android.defaults.buildfeatures.buildconfig=false
android.defaults.buildfeatures.resvalues=false
android.defaults.buildfeatures.aidl=false
android.defaults.buildfeatures.renderscript=false
android.defaults.buildfeatures.shaders=false

# Enables R8 full mode (more aggressive, faster shrinking) for release
# builds — safe here since proguard-rules.pro explicitly keeps the two
# reflectively-used surfaces (the JS bridge and AndroidX Webkit).
android.enableR8.fullMode=true

# Non-transitive R classes: each module only sees its own resources in its
# generated R class, which is faster to build and avoids resource id
# collisions as the project grows.
android.nonTransitiveRClass=true
